services:
  - type: web
    name: staffsync-hrm
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
